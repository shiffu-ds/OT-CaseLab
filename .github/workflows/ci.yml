name: Verify prototype
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 verified 2026-10-01
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install uv==0.10.8
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check services ai ml tests infra data/demo
      - run: uv run pytest -q
      - run: uv run python -m ai.evaluate
      - run: uv run python -m services.mcp.smoke
      - run: uv run python -m ml.train --synthetic --output .runtime/ci-synthetic
      - run: npm ci --prefix apps/web
      - run: npm run --prefix apps/web typecheck
      - run: npm run --prefix apps/web build
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - name: Browser journey with fictional data
        env:
          PROVIDER_MODE: scripted
          ALLOW_DEMO: 'true'
          APP_ORIGIN: http://localhost:3005
          WEB_BASE_URL: http://localhost:3005
        run: |
          set -euo pipefail
          uv run alembic upgrade head
          uv run python -m services.api.seed
          .venv/bin/python -m uvicorn services.api.main:app --host 127.0.0.1 --port 8000 > .runtime/ci-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          npm run --prefix apps/web test:e2e
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build -f infra/api.Dockerfile -t otcaselab-api:ci .
      - run: docker build -f infra/web.Dockerfile -t otcaselab-web:ci .
